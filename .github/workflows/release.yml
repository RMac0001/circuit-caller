name: Release

# On every push to main: if versionName in app/build.gradle.kts has no GitHub release yet,
# build the APK and publish one (GitHub creates the tag, no "v" prefix). Install the APK
# from the release page on the phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already released
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "Couldn't read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "Release $version already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check that versionCode increased
        if: steps.version.outputs.exists == 'false'
        # Android won't install a lower or equal versionCode as an update.
        run: |
          read_code() { sed -n 's/^ *versionCode = \([0-9][0-9]*\).*/\1/p'; }
          code=$(read_code < app/build.gradle.kts)
          if [ -z "$code" ]; then
            echo "Couldn't read versionCode from app/build.gradle.kts" >&2
            exit 1
          fi
          previous_tag=$(gh release view --json tagName --jq .tagName 2> /dev/null || true)
          if [ -z "$previous_tag" ]; then
            echo "No earlier release; versionCode $code is fine."
            exit 0
          fi
          git fetch --depth=1 origin "refs/tags/$previous_tag:refs/tags/$previous_tag"
          previous_code=$(git show "$previous_tag:app/build.gradle.kts" | read_code)
          if [ -n "$previous_code" ] && [ "$code" -le "$previous_code" ]; then
            echo "versionName changed to ${{ steps.version.outputs.version }} but versionCode $code" \
              "is not greater than $previous_code (release $previous_tag). Bump both together." >&2
            exit 1
          fi
          echo "versionCode $previous_code ($previous_tag) -> $code"
      - uses: actions/setup-java@v4
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists == 'false'
      - if: steps.version.outputs.exists == 'false'
        run: ./gradlew check :app:assembleRelease
      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        run: |
          apk="circuit-caller-${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes \
            "$apk"
